services:
  redis:
    image: redis:alpine
  db:
    image: postgres:17.0
    command: -p $DB_PORT
    hostname: db
    ports:
      - "$DB_PORT:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      TZ: $TIMEZONE
      PGTZ: $TIMEZONE
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
  backend:
    restart: on-failure
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver
    hostname: backend
    ports:
      - "$BE_PORT:8000"
    volumes:
      - ./backend:/app
    environment:
      - TZ=$TIMEZONE
    env_file:
      - .env
    depends_on:
      - db
      - redis
  celery_worker:
    build: ./backend
    command: celery -A GoodDeeds worker -l info
    hostname: celery_worker
    volumes:
      - ./backend/:/usr/src/app/
    env_file:
      - .env
    depends_on:
      - redis
  celery_beat:
    build: ./backend
    hostname: celery_beat
    command: celery -A GoodDeeds beat -l info
    volumes:
      - ./backend/:/usr/src/app/
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  db-data:
  backend:
